services:
  kabod-api:
    build: ./backend
    container_name: kabod-api
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - TOKEN_SECRETO=cambiar-este-secreto
    volumes:
      - ./backend/src/data:/app/src/data
    restart: unless-stopped

  kabod-web:
    build: ./frontend
    container_name: kabod-web
    ports:
      - "3000:80"
    depends_on:
      - kabod-api
    restart: unless-stopped